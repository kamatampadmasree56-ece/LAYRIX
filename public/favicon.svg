<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Chip body -->
  <rect x="16" y="16" width="32" height="32" rx="4" fill="#0B172A" stroke="#2563EB" stroke-width="2"/>
  <!-- Inner core -->
  <rect x="22" y="22" width="20" height="20" rx="2" fill="#1E3A8A"/>
  <!-- Grid lines on core -->
  <line x1="28" y1="22" x2="28" y2="42" stroke="#2563EB" stroke-width="0.8" opacity="0.5"/>
  <line x1="34" y1="22" x2="34" y2="42" stroke="#2563EB" stroke-width="0.8" opacity="0.5"/>
  <line x1="22" y1="28" x2="42" y2="28" stroke="#2563EB" stroke-width="0.8" opacity="0.5"/>
  <line x1="22" y1="34" x2="42" y2="34" stroke="#2563EB" stroke-width="0.8" opacity="0.5"/>
  <!-- Center node -->
  <circle cx="32" cy="32" r="3" fill="#06B6D4"/>
  <!-- Pin connectors - top -->
  <rect x="24" y="10" width="3" height="6" rx="1" fill="#2563EB"/>
  <rect x="31" y="10" width="3" height="6" rx="1" fill="#2563EB"/>
  <rect x="38" y="10" width="3" height="6" rx="1" fill="#2563EB"/>
  <!-- Pin connectors - bottom -->
  <rect x="24" y="48" width="3" height="6" rx="1" fill="#2563EB"/>
  <rect x="31" y="48" width="3" height="6" rx="1" fill="#2563EB"/>
  <rect x="38" y="48" width="3" height="6" rx="1" fill="#2563EB"/>
  <!-- Pin connectors - left -->
  <rect x="10" y="24" width="6" height="3" rx="1" fill="#2563EB"/>
  <rect x="10" y="31" width="6" height="3" rx="1" fill="#2563EB"/>
  <rect x="10" y="38" width="6" height="3" rx="1" fill="#2563EB"/>
  <!-- Pin connectors - right -->
  <rect x="48" y="24" width="6" height="3" rx="1" fill="#2563EB"/>
  <rect x="48" y="31" width="6" height="3" rx="1" fill="#2563EB"/>
  <rect x="48" y="38" width="6" height="3" rx="1" fill="#2563EB"/>
  <!-- Routing traces -->
  <polyline points="32,29 32,26 36,26 36,24" stroke="#06B6D4" stroke-width="1.2" fill="none" opacity="0.8"/>
  <polyline points="35,32 38,32 38,36 40,36" stroke="#8B5CF6" stroke-width="1.2" fill="none" opacity="0.8"/>
</svg>